name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The tmux integration tests run against a private socket of their own,
      # so nothing here can touch a real session.
      - name: Install tmux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux
          tmux -V

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      # Catches a break in any cross-compile target before a tag does.
      - name: Cross-compile
        run: |
          set -eu
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null .
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/berth-clipd
            echo "ok $target"
          done
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -o /dev/null ./cmd/berth-clipd
            echo "ok windows/$arch"
          done
